<!DOCTYPE html>

  <title>Safety Ninja UST Fit Check</title>

  <style>

    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2); }

<body class="py-6">

<div class="max-w-2xl mx-auto px-4">
  <div class="mb-6 text-center">

    <p class="text-sm text-gray-400 mt-1">Corrected generic tank chart · 3 tank check · Using whole inches</p>
  </div>

  <div id="tanks" class="space-y-6 mb-8"></div>

  <p class="text-xs text-gray-500 text-center px-2 leading-relaxed">
    90% cap = 90% Ullage of the selected rated gallons. Site-specific charts or ATG (VEEDER-ROOT) readings override this tool.
  </p>
</div>

  7000: [null, 13, 28, 69, 106, 148, 194, 244, 297, 354, 413, 475, 539, 606, 678, 746, 819, 894, 970, 1048, 1128, 1209, 1292, 1376, 1461, 1547, 1635, 1723, 1813, 1903, 1995, 2087, 2180, 2274, 2368, 2463, 2558, 2654, 2751, 2848, 2945, 3040, 3140, 3239, 3337, 3435, 3534, 3633, 3731, 3830, 3929, 4027, 4125, 4224, 4324, 4419, 4516, 4613, 4710, 4806, 4901, 4996, 5091, 5184, 5277, 5369, 5461, 5551, 5641, 5729, 5817, 5903, 5988, 6072, 6155, 6236, 6316, 6394, 6470, 6545, 6618, 6689, 6758, 6825, 6889, 6949, 7010, 7067, 7120, 7170, 7216, 7258, 7295, 7326, 7351, 7364],
  8000: [null, 15, 41, 76, 117, 163, 214, 269, 327, 389, 454, 522, 593, 667, 742, 821, 901, 983, 1067, 1153, 1241, 1330, 1421, 1513, 1607, 1702, 1798, 1896, 1994, 2094, 2194, 2296, 2398, 2501, 2604, 2709, 2814, 2920, 3026, 3132, 3239, 3344, 3454, 3562, 3670, 3779, 3887, 3996, 4104, 4213, 4321, 4430, 4538, 4646, 4756, 4851, 4968, 5075, 5181, 5286, 5391, 5496, 5600, 5703, 5805, 5906, 6007, 6106, 6205, 6302, 6398, 6493, 6587, 6679, 6770, 6860, 6947, 7033, 7117, 7200, 7280, 7358, 7434, 7507, 7578, 7647, 7711, 7773, 7832, 7886, 7937, 7983, 8024, 8059, 8086, 8101],

  12000: [null, 21, 60, 111, 170, 237, 311, 391, 476, 566, 661, 760, 863, 970, 1080, 1194, 1310, 1430, 1552, 1677, 1806, 1935, 2067, 2201, 2338, 2476, 2515, 2757, 2900, 3045, 3192, 3339, 3488, 3638, 3788, 3940, 4093, 4247, 4401, 4556, 4712, 4864, 5025, 5182, 5339, 5497, 5655, 5812, 5970, 6128, 6286, 6444, 6601, 6758, 6915, 7071, 7226, 7381, 7536, 7689, 7842, 7994, 8145, 8295, 8444, 8591, 8737, 8882, 9025, 9167, 9307, 9445, 9581, 9715, 9848, 9978, 10105, 10230, 10333, 10472, 10589, 10703, 10813, 10917, 11022, 11118, 11218, 11307, 11391, 11471, 11545, 11612, 11671, 11722, 11761, 11783],
  15000: [null, 21, 58, 107, 164, 229, 300, 377, 459, 546, 638, 734, 834, 938, 1045, 1156, 1270, 1386, 1506, 1628, 1753, 1881, 2011, 2144, 2277, 2413, 2552, 2692, 2908, 3123, 3270, 3419, 3569, 3720, 3872, 4026, 4181, 4337, 4494, 4652, 4811, 4971, 5131, 5292, 5454, 5617, 5780, 5944, 6108, 6272, 6437, 6603, 6768, 6934, 7100, 7266, 7432, 7598, 7764, 7930, 8096, 8261, 8427, 8592, 8756, 8920, 9084, 9247, 9410, 9572, 9733, 9893, 10053, 10212, 10370, 10527, 10683, 10838, 10992, 11144, 11295, 11445, 11594, 11741, 11886, 12030, 12172, 12312, 12451, 12587, 12720, 12843, 12983, 13111, 13236, 13358, 13478, 13594, 13708, 13819, 13926, 14030, 14130, 14226, 14300, 14405, 14487, 14564, 14635, 14700, 14757, 14806, 14843, 14864],
  20000: [null, 28, 77, 141, 217, 302, 396, 437, 606, 721, 842, 969, 1101, 1238, 1380, 1525, 1676, 1830, 1988, 2149, 2318, 2483, 2654, 2828, 3006, 3186, 3368, 3553, 3741, 3931, 4123, 4317, 4512, 4710, 4910, 5111, 5314, 5519, 5724, 5932, 6141, 6350, 6561, 6773, 6986, 7199, 7414, 7629, 7845, 8062, 8279, 8497, 8715, 8934, 9152, 9371, 9590, 9809, 10028, 10248, 10466, 10685, 10903, 11121, 11339, 11556, 11773, 11989, 12204, 12419, 12633, 12846, 13058, 13268, 13478, 13687, 13894, 14100, 14304, 14507, 14708, 14908, 15106, 15302, 15496, 15688, 15878, 16065, 16250, 16433, 16613, 16790, 16965, 17136, 17300, 17469, 17631, 17789, 17943, 18093, 18239, 18331, 18518, 18650, 18776, 18898, 19013, 19121, 19223, 19317, 19402, 19477, 19542, 19619],
};

const SIZES = [1000,2000,3000,4000,5000,6000,7000,8000,10000,12000,15000,20000];

function fmt(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return Number(n).toLocaleString("en-US");
}

function gallonsAt(size, inches) {
  const col = CHART[size];
  if (!col) return null;
  if (!Number.isInteger(inches) || inches < 1 || inches >= col.length || col[inches] == null) return null;
  return col[inches];
}

function maxInch(size) {
  return CHART[size].length - 1;
}

function ninetyCap(size) {
  return Math.round(size * 0.9);
}

function inchForGallons(size, gallons) {
  const col = CHART[size];
  if (!col) return null;
  if (gallons > col[col.length - 1]) return "OVER";
  for (let i = 1; i < col.length; i++) {
    if (col[i] >= gallons) return i;
  }
  return "OVER";
}

function statusBadge(kind, text) {
  const cls = kind === "fit" ? "badge-fit" : kind === "nofit" ? "badge-nofit" : kind === "over" ? "badge-over" : "badge-wait";
  return `<div class="rounded-2xl py-3 px-4 text-center text-2xl font-black tracking-wide ${cls}">${text}</div>`;
}

function calcTank(id) {
  const size = Number(document.getElementById(`size-${id}`).value);
  const inchRaw = document.getElementById(`inch-${id}`).value;
  const galRaw = document.getElementById(`gal-${id}`).value;
  const out = document.getElementById(`out-${id}`);

  if (!size || inchRaw === "" || galRaw === "") {
    out.innerHTML = statusBadge("wait", "ENTER DATA") + `<p class="text-sm text-gray-500 mt-3 text-center">Select tank size, stick inches, and net gallons.</p>`;
    return;
  }

  const inches = Number(inchRaw);
  const netGal = Number(galRaw);

  if (!Number.isInteger(inches) || inches < 0 || netGal < 0 || Number.isNaN(netGal)) {
    out.innerHTML = statusBadge("over", "CHECK ENTRIES");
    return;
  }

  let currentGal;
  if (inches === 0) currentGal = 0;
  else currentGal = gallonsAt(size, inches);

  if (currentGal == null) {
    out.innerHTML = statusBadge("over", "OVER CHART MAX") +
      `<p class="text-sm text-gray-600 mt-3 text-center">Stick ${inches}" is past the last chart row for a ${fmt(size)} gal tank (max ${maxInch(size)}").</p>`;
    return;
  }

  const cap90 = ninetyCap(size);
  const after = currentGal + netGal;
  const afterInch = inchForGallons(size, after);
  const inch90 = inchForGallons(size, cap90);
  renderResult(out, size, inches, currentGal, netGal, after, afterInch, cap90, inch90);
}

function renderResult(out, size, inches, currentGal, netGal, after, afterInch, cap90, inch90) {
  const overAfter = afterInch === "OVER";
  const fits = after <= cap90;
  let badge;
  if (overAfter && !fits) badge = statusBadge("nofit", "NO FIT") + `<div class="mt-2">${statusBadge("over", "OVER CHART MAX")}</div>`;
  else if (overAfter) badge = statusBadge("over", "OVER CHART MAX");
  else if (fits) badge = statusBadge("fit", "FIT");
  else badge = statusBadge("nofit", "NO FIT");

  const room = cap90 - after;
  const roomTxt = room >= 0
    ? `<span class="font-semibold text-emerald-700">${fmt(room)} gal remaining to 90%</span>`
    : `<span class="font-semibold text-red-700">${fmt(Math.abs(room))} gal over 90%</span>`;

  const afterInchTxt = overAfter ? "OVER CHART MAX" : afterInch + '"';
  const inch90Txt = inch90 === "OVER" ? "OVER CHART MAX" : inch90 + '"';

  out.innerHTML = `
    ${badge}
    <div class="grid grid-cols-2 gap-3 mt-4 text-sm">
      <div class="rounded-xl bg-gray-50 p-3">
        <div class="text-xs font-bold text-gray-500 uppercase">90% Cap</div>
        <div class="font-bold text-lg">${fmt(cap90)} gal</div>
        <div class="text-gray-600">${inch90Txt}</div>
      </div>
      <div class="rounded-xl bg-gray-50 p-3">
        <div class="text-xs font-bold text-gray-500 uppercase">Current</div>
        <div class="font-bold text-lg">${fmt(currentGal)} gal</div>
        <div class="text-gray-600">${inches}"</div>
      </div>
      <div class="rounded-xl bg-gray-50 p-3">
        <div class="text-xs font-bold text-gray-500 uppercase">After Offload</div>
        <div class="font-bold text-lg">${fmt(after)} gal</div>
        <div class="text-gray-600">${afterInchTxt}</div>
      </div>
      <div class="rounded-xl bg-gray-50 p-3">
        <div class="text-xs font-bold text-gray-500 uppercase">Room to 90%</div>
        <div class="mt-1">${roomTxt}</div>
      </div>
    </div>`;
}

function sizeOptions() {
  return SIZES.map(s => `<option value="${s}">${s.toLocaleString()} gal (100%)</option>`).join("");
}

function tankCard(id) {
  return `
  <div class="card rounded-3xl shadow-md p-6">
    <div class="flex items-center gap-3 mb-4">
      <i class="fas fa-database text-2xl" style="color:#219c29"></i>
      <h2 class="font-bold text-lg uppercase tracking-wide">Tank ${id}</h2>
    </div>

    <label class="block uppercase text-blue-600 text-xs font-bold tracking-widest mb-1">100% Tank Volume</label>
    <select id="size-${id}" onchange="calcTank(${id})" class="w-full mb-4 px-4 py-3 text-lg border border-gray-300 rounded-2xl bg-white">
      <option value="">Select size</option>
      ${sizeOptions()}
    </select>

    <label class="block uppercase text-blue-600 text-xs font-bold tracking-widest mb-1">Stick Reading Before (inches)</label>
    <input id="inch-${id}" type="number" inputmode="numeric" min="0" step="1" placeholder="Whole inches" oninput="calcTank(${id})" class="w-full mb-4 px-4 py-3 text-lg border border-gray-300 rounded-2xl bg-white">

    <label class="block uppercase text-blue-600 text-xs font-bold tracking-widest mb-1">Net Gallons to Offload</label>
    <input id="gal-${id}" type="number" inputmode="numeric" min="0" step="1" placeholder="Net gallons" oninput="calcTank(${id})" class="w-full mb-5 px-4 py-3 text-lg border border-gray-300 rounded-2xl bg-white">

    <div id="out-${id}"></div>
  </div>`;
}

document.getElementById("tanks").innerHTML = [1,2,3].map(tankCard).join("");
[1,2,3].forEach(calcTank);
</script>
